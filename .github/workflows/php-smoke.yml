name: PHP smoke checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql
          coverage: none
      - name: Lint PHP
        run: |
          php -l app/index.php
          php -l src/TenantContext.php
          php -l src/Database.php
          php -l tests/TenantContextTest.php
          php -l tests/DatabaseTest.php
      - name: Run smoke checks
        run: sh tests/smoke.sh
      - name: Run tenant hostname tests
        run: php tests/TenantContextTest.php
      - name: Run database configuration tests
        run: php tests/DatabaseTest.php
