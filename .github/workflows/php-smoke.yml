name: PHP smoke checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: alq_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql
          coverage: none
      - name: Lint PHP
        run: |
          php -l app/index.php
          php -l src/TenantContext.php
          php -l src/Database.php
          php -l src/TenantMembershipRepository.php
          php -l src/SessionSecurity.php
          php -l src/AuthService.php
          php -l tests/TenantContextTest.php
          php -l tests/DatabaseTest.php
          php -l tests/SessionSecurityTest.php
          php -l tests/TenantContextIntegrationTest.php
      - name: Run smoke checks
        run: sh tests/smoke.sh
      - name: Run tenant hostname tests
        run: php tests/TenantContextTest.php
      - name: Run database configuration tests
        run: php tests/DatabaseTest.php
      - name: Run session security tests
        run: php tests/SessionSecurityTest.php
      - name: Run PostgreSQL tenant resolution integration tests
        run: php tests/TenantContextIntegrationTest.php
